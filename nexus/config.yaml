---
name: "Nexus Repository"
description: "Self-hosted universal artifact repository (Maven, npm, PyPI, Docker, etc.) — proxy caches for public registries and private hosted storage. Accessible via ingress for the web UI and direct ports for artifact upload/download from CI/CD tools like GitHub Actions."
version: "1.0.6"
slug: "nexus_repository"
init: false

arch:
  - amd64
  - aarch64

url: "https://github.com/sonatype/nexus-public"

startup: application
boot: auto

ingress: true
ingress_port: 8086
ingress_stream: false
panel_icon: mdi:package-variant-closed
panel_title: "Nexus"
webui: "http://[HOST]:[PORT:8086]/"

ports:
  8086/tcp: 8086
  8087/tcp: ~
  8088/tcp: ~
  8089/tcp: ~
ports_description:
  8086/tcp: "Nexus web UI and REST API (also used by Docker hosted registry connector)"
  8087/tcp: "Docker proxy registry (configure connector in Nexus UI)"
  8088/tcp: "Docker group registry (configure connector in Nexus UI)"
  8089/tcp: "Extra registry port (configure connector in Nexus UI)"

map:
  - data:rw
  - media:rw

options:
  java_mem: "-Xms2g -Xmx2g -XX:MaxDirectMemorySize=2g"
schema:
  java_mem: str
