[project]
name = "fleet-telemetry-addon"
version = "0.10.16"
description = "Tesla Fleet Telemetry Home Assistant add-on — webapp, shim, bridge"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# The add-on's Python sources live under webapp/ and are run directly (no package install);
# tests add that dir to sys.path via conftest.py.
