---
name: "Tesla Fleet Telemetry"
description: "Self-hosted Tesla fleet-telemetry server — receive streaming vehicle telemetry over mTLS and fan it out to Logger, MQTT, or Google Pub/Sub"
version: "1.0.27"
slug: "fleet_telemetry"
init: false

# Upstream binary is published amd64-only (tesla/fleet-telemetry); we copy it directly.
arch:
  - amd64

# External resources
url: "https://github.com/teslamotors/fleet-telemetry"

startup: application
boot: auto

# Web dashboard (ingress): latest telemetry + server health, served in the HA sidebar.
ingress: true
ingress_port: 8099
panel_icon: mdi:car-electric
panel_title: "Tesla Telemetry"

# Internal listen ports are FIXED here; remap the host side in the Network tab and point your
# NGINX Proxy Manager passthrough Stream at the chosen host port.
ports:
  4443/tcp: 4443
  8080/tcp: 8080
  9090/tcp: 9090
  8081/tcp: 8081
  8085/tcp: 8085
  8100/tcp: 8100
ports_description:
  4443/tcp: "Vehicle telemetry (mTLS). Point your NPM passthrough Stream here."
  8080/tcp: "Status/health endpoint"
  9090/tcp: "Prometheus metrics (only used when metrics_enabled is on)"
  8081/tcp: "TeslaMate streaming websocket (when enable_teslamate_bridge is on). Front with TLS for wss."
  8085/tcp: "Fleet-API shim for TeslaMate (point TeslaMate's TESLA_API_HOST here; set use_streaming_api=false)"
  8100/tcp: "Public-key host. The setup wizard auto-creates an NPM proxy host (HTTPS :443) forwarding to this port to serve the Tesla 3p public key."

# Persistent storage for the wizard config, generated config.json, fetched TLS certs,
# the generated EC keypair, and GCP credentials.
map:
  - data:rw

# Used for bashio::info.timezone; entities are not published directly by this add-on
hassio_api: true

# Auto-discover the Home Assistant MQTT broker when the MQTT backend is enabled with a blank broker
services:
  - mqtt:want

# No add-on configuration options: this add-on is configured entirely through its built-in setup
# wizard (open the add-on via the sidebar / ingress). The wizard writes /data/wizard-config.json,
# generates the EC keypair, hosts the public key, and drives Tesla partner registration + vehicle
# telemetry config. The HA Configuration page is intentionally empty.
