---
name: "GitHub Actions Runner"
description: "Self-hosted GitHub Actions runner(s) for long-running container builds, backed by USB storage"
version: "0.2.0"
slug: "github_runner"
init: false
url: "https://github.com/mattbsea/home-assistant-addons"

arch:
  - amd64

startup: application
boot: auto

# Nested Docker-in-Docker (privileged/full_access) could not create any container on this
# Supervisor regardless of storage driver, cgroup driver, runc version, or capability combination
# tried (see CHANGELOG 0.1.1-0.1.7 and DOCS.md). Builds now run on the Supervisor's own Docker
# daemon via its socket instead. This is a real, documented risk — HA calls docker_api
# "dangerous... can be used to gain root access to the host system" — any job this runner executes
# can control every other container on this host, not just its own sandbox. Accepted as a
# conscious tradeoff after DinD proved unworkable here.
docker_api: true

ingress: true
ingress_port: 8099
panel_icon: mdi:github
panel_title: "GitHub Runner"

map:
  - media:rw

options:
  data_path: "/media/usbdisk/github-runner"
  targets:
    - name: "example"
      scope: "repo"
      url: "owner/repo"
      token: ""
      labels: ""

schema:
  data_path: str
  targets:
    - name: str
      scope: list(repo|org)
      url: str
      token: password
      labels: str?
