---
name: "RustDesk Server"
description: "Self-hosted RustDesk server (hbbs/hbbr) plus a browser-accessible RustDesk client, served over ingress"
version: "1.0.0"
slug: "rustdesk"
init: false

# linuxserver/rustdesk (the browser-streamed client) publishes amd64/arm64 only — no armv7.
arch:
  - aarch64
  - amd64

url: "https://github.com/linuxserver/docker-rustdesk"

startup: services
boot: auto

# Ingress serves the RustDesk desktop client itself (streamed via Selkies), not a status page.
# Port 3000 is the image's plain-HTTP Selkies port; HA's own HTTPS front door satisfies the
# browser's Secure Context requirement for clipboard/WebCodecs, so the container doesn't need to
# terminate TLS itself. The container's built-in HTTP Basic Auth is intentionally left disabled
# (no PASSWORD set) since ingress already gates access to logged-in HA users — which is exactly
# why port 3000 must stay ingress-only and NEVER be added to `ports:` below.
ingress: true
ingress_port: 3000
panel_icon: mdi:monitor-share
panel_title: "RustDesk"

# hbbs/hbbr listen ports — the actual RustDesk wire protocol, unrelated to ingress. These must be
# reachable from the internet (via router port-forward) for devices outside your LAN to connect.
ports:
  21115/tcp: 21115
  21116/tcp: 21116
  21116/udp: 21116
  21117/tcp: 21117
  21118/tcp: 21118
  21119/tcp: 21119
ports_description:
  21115/tcp: "hbbs: NAT type test"
  21116/tcp: "hbbs: hole punching / connection service"
  21116/udp: "hbbs: ID registration & heartbeat (required)"
  21117/tcp: "hbbr: relay service"
  21118/tcp: "hbbs: web client WebSocket (only needed for browser-based RustDesk clients)"
  21119/tcp: "hbbr: web client WebSocket (only needed for browser-based RustDesk clients)"

options:
  relay_host: ""
  encrypted_only: true
  custom_key: ""
schema:
  relay_host: "str?"
  encrypted_only: "bool"
  custom_key: "password?"

# /data/rustdesk: hbbs/hbbr's identity keypair. /data/config: the desktop client's own state
# (saved peers, passwords, prefs), symlinked from /config by custom-cont-init.d. Losing this
# directory changes the server's identity and breaks every client that already trusts the old
# public key.
map:
  - data:rw
