name: OpenCode
version: "2.0.5"
slug: opencode_serve
description: OpenCode AI coding assistant for Home Assistant — accessible on host port with full HA entity access
url: https://github.com/drakonizer/opencode-ha-addon
arch:
  - amd64
  - aarch64
init: false
startup: application
host_network: false
hassio_api: true
homeassistant_api: true
ports:
  "4096/tcp": 4096
map:
  - data:rw
  - config:rw
  - ssl:ro
  - addon_configs:rw
options:
  provider: "anthropic"
  api_key: ""
  model: ""
  small_model: ""
  ollama_host: ""
  ollama_keep_alive: ""
  github_token: ""
schema:
  provider: str
  api_key: "password?"
  model: "str?"
  small_model: "str?"
  ollama_host: "str?"
  ollama_keep_alive: "str?"
  github_token: "password?"
boot: auto
