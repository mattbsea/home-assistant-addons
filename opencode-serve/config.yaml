---
name: "OpenCode"
description: "AI coding agent web interface powered by OpenCode"
version: "1.1.0"
slug: "opencode_serve"
init: false
url: "https://github.com/anomalyco/opencode"

arch:
  - aarch64
  - amd64

ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:code-braces
panel_title: "OpenCode"

ports:
  4096/tcp: 4096
ports_description:
  4096/tcp: "OpenCode web interface (not required for ingress)"

map:
  - data:rw

startup: services
boot: auto

webui: http://[HOST]:[PORT:4096]/

hassio_api: true
homeassistant_api: true

options:
  log_level: "info"
schema:
  log_level: list(debug|info|warn|error)
