build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:bookworm
  amd64: ghcr.io/home-assistant/amd64-base-debian:bookworm

# The app is built from its own repository, pinned to one commit. Bump APP_REF (a FULL 40-character
# commit SHA, never a branch or tag) together with `version:` in config.yaml for every release.
args:
  APP_REPO: "https://github.com/mattbsea/nutrition-mcp.git"
  APP_REF: "5dbae008cef2e76ebefe4bdcd828899306420602"

labels:
  org.opencontainers.image.title: "Home Assistant Add-on: Food Tracker (nutrition-mcp)"
  org.opencontainers.image.description: "Self-hosted nutrition tracker with an MCP endpoint, Apple Health shortcut API and dashboard"
  org.opencontainers.image.source: "https://github.com/akutishevsky/nutrition-mcp"
  org.opencontainers.image.licenses: "MIT"
