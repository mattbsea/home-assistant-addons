---
name: "Playwright MCP"
description: "Exposes a headless Playwright browser to AI clients via MCP with a secret-path HTTP URL"
version: "0.1.0"
slug: "playwright_mcp"
init: false
url: "https://github.com/mattbsea/home-assistant-addons"

arch:
  - aarch64
  - amd64

startup: application
boot: auto

ports:
  9585/tcp: 9585
ports_description:
  9585/tcp: "Playwright MCP HTTP endpoint"

map:
  - data:rw

options:
  secret_path: ""
  browser: "chromium"
  viewport_size: "1280x720"
  extra_args: ""

schema:
  secret_path: str?
  browser: list(chromium|firefox|webkit)?
  viewport_size: str?
  extra_args: str?
