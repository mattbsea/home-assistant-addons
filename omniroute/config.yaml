---
name: "OmniRoute"
description: "AI gateway — route any LLM through one OpenAI-compatible endpoint with smart routing, load balancing, and fallbacks"
version: "1.1.0"
slug: "omniroute"
init: false

# Supported architectures (armv7 not supported by OmniRoute)
arch:
  - amd64

# External resources
url: "https://github.com/diegosouzapw/OmniRoute"

startup: application
boot: auto

# Web interface configuration
ingress: true
ingress_port: 20128
panel_icon: mdi:router-wireless
panel_title: "OmniRoute"

# Add-on configuration options
options:
  omniroute_password: "abcd1234"
  setup_providers: []
schema:
  omniroute_password: str?
  setup_providers:
    - str

# Volume mappings for persistent data
map:
  - data:rw     # Add-on data directory (/data) - OmniRoute database persisted here

# API access for Home Assistant integration
hassio_api: true

