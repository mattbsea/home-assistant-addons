# OmniRoute ingress proxy — listens on 20128, proxies to OmniRoute on 20129
# HA ingress proxy already strips /api/hassio_ingress/<token> before forwarding

error_log /dev/stderr info;

server {
    listen 20128;

    access_log /dev/stdout;
    error_log  /dev/stderr info;

    client_max_body_size 100m;

    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header X-Ingress-Path $http_x_ingress_path;

    # Redirect bare / to /dashboard (OmniRoute serves the app there)
    location = / {
        return 302 $http_x_ingress_path/dashboard;
    }

    # Proxy everything else to OmniRoute
    location / {
        proxy_pass http://127.0.0.1:20129;
        proxy_redirect / $http_x_ingress_path/;

        sub_filter_once off;
        sub_filter_types text/html text/css text/javascript application/javascript application/json;
        sub_filter 'href="/'  'href="'"$http_x_ingress_path"'/';
        sub_filter 'src="/'   'src="'"$http_x_ingress_path"'/';
        sub_filter 'url("/'   'url("'"$http_x_ingress_path"'/';
        sub_filter "url('"    "url('"$http_x_ingress_path"'/";
        sub_filter 'action="/' 'action="'"$http_x_ingress_path"'/';

        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
