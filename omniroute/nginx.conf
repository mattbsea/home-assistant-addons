# OmniRoute ingress proxy — strips HA ingress prefix, proxies to OmniRoute on 20129
# Logs everything to stdout/stderr so HA Supervisor captures it

# Send nginx logs to stdout so HA Supervisor captures them
error_log /dev/stderr info;

server {
    listen 20128;

    # Logs to stdout for HA Supervisor
    access_log /dev/stdout;
    error_log  /dev/stderr info;

    # Allow large payloads (OmniRoute may upload configs)
    client_max_body_size 100m;

    # Pass the HA ingress path to the backend so it can rewrite URLs if needed
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;

    # The regex captures everything after the ingress token so we can strip it.
    # HA sends: /api/hassio_ingress/<token>/<path>
    # We proxy the <path> part to OmniRoute on 20129.
    location ~ ^/api/hassio_ingress/[^/]+/(?<app_path>.*)?$ {

        # Log what we're actually proxying (helps debug 404s)
        add_header X-Debug-Ingress-Path $http_x_ingress_path always;
        add_header X-Debug-App-Path $app_path always;

        # Forward the ingress path to OmniRoute (it may need it for URL rewriting)
        proxy_set_header X-Ingress-Path $http_x_ingress_path;

        # Proxy to OmniRoute with the stripped path
        # If app_path is empty (bare ingress URL), proxy to /
        proxy_pass http://127.0.0.1:20129/$app_path$is_args$args;

        # Rewrite Location headers in redirects (301/302/307)
        # e.g. Location: /dashboard → Location: /api/hassio_ingress/xxx/dashboard
        proxy_redirect / $http_x_ingress_path/;

        # Rewrite HTML href/src attributes so the browser loads assets through the ingress proxy
        sub_filter_once off;
        sub_filter_types text/html text/css text/javascript application/javascript application/json;
        sub_filter 'href="/' "href=\"$http_x_ingress_path/";
        sub_filter 'src="/' "src=\"$http_x_ingress_path/";
        sub_filter 'url("/' "url=\"$http_x_ingress_path/";
        sub_filter "url('" "url('$http_x_ingress_path/";
        sub_filter 'action="/' "action=\"$http_x_ingress_path/";

        # Don't buffer SSE/WebSocket responses (OmniRoute streams events)
        proxy_buffering off;
        proxy_cache off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Catch-all: anything not matching the ingress pattern returns 404
    location / {
        return 404 '{"error": "not_found", "hint": "URL must start with /api/hassio_ingress/<token>/"}';
        add_header Content-Type application/json always;
    }
}
