---
name: "Paseo"
description: "Paseo daemon + web UI: run Claude Code, Codex and OpenCode agents from the browser, sidebar or the Paseo iPhone app"
version: "1.4.0"
slug: "paseo"
init: false

arch:
  - aarch64
  - amd64

url: "https://paseo.sh"

startup: application
boot: auto

# Needed to write the auto-generated password back into this add-on's own options
# (POST /addons/self/options) on first start.
hassio_api: true

# The sidebar panel is a tiny wrapper page that frames external_url. Paseo's Expo web app uses
# absolute paths (/_expo/..., /ws, /api/...) and has no base-path support, so it cannot be
# served under HA's /api/hassio_ingress/<token>/ prefix directly.
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-outline
panel_title: "Paseo"

# The daemon itself (API + WebSocket /ws + bundled web UI). Nginx Proxy Manager terminates TLS
# for paseo.mbarclay.org and forwards here; the iPhone app connects to that hostname on 443.
ports:
  6767/tcp: 6767
ports_description:
  6767/tcp: "Paseo daemon (web UI, API and WebSocket). Password protected. Front it with an HTTPS reverse proxy."

map:
  - share:rw

options:
  password: ""
  external_url: "https://paseo.mbarclay.org"
  hostnames:
    - "paseo.mbarclay.org"
  trusted_proxies:
    - "loopback"
    - "172.30.32.0/23"
  workspace_dir: "/share/paseo"
  claude_code_oauth_token: ""
  anthropic_api_key: ""
  openai_api_key: ""
  env_vars: []
schema:
  password: "password?"
  external_url: "url"
  hostnames:
    - "str"
  trusted_proxies:
    - "str"
  workspace_dir: "str"
  claude_code_oauth_token: "password?"
  anthropic_api_key: "password?"
  openai_api_key: "password?"
  env_vars:
    - name: "match(^[A-Za-z_][A-Za-z0-9_]*$)"
      value: "str?"
