worker_processes 1;
pid /tmp/nginx.pid;
daemon off;

events {
    worker_connections 64;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    # rustdesk-api's root handler issues a bare-path redirect ("/_admin/") with no awareness of
    # any reverse proxy in front of it (http/controller/web/index.go: c.Redirect(302, "/_admin/")).
    # nginx's proxy_redirect auto-qualifies a leading-slash replacement into a full URL using its
    # OWN scheme/host/port ($scheme://$host:$server_port) when it doesn't already have one --
    # which is always wrong here, since that's this container's internal view (plain http,
    # port 21114), never what the actual browser is talking to. Confirmed live: without this,
    # every path ended up as "http://<public-domain>:21114/_admin/" through NPM -- the internal
    # port, unencrypted, often not even the port a router forwards. Build the correct prefix
    # ourselves instead of letting nginx guess, from whichever proxy actually fronted this
    # request:
    #   - Home Assistant ingress sets X-Ingress-Path to the per-session path prefix the browser
    #     is actually using (e.g. /api/hassio_ingress/<token>). We deliberately leave this branch
    #     as a bare path -- nginx's own auto-qualification still kicks in and produces something
    #     like "http://<container-ip>:21114/api/hassio_ingress/<token>/_admin/", which looks
    #     wrong in isolation, but Home Assistant's own ingress proxy transparently rewrites
    #     Location headers pointing back at an add-on's own container address into the correct
    #     public ingress URL (confirmed live: this path has worked end-to-end for real ingress
    #     traffic since before this fix). Giving it a fully-qualified value instead would require
    #     guessing the HA frontend's own public domain, which nothing here actually knows.
    #   - Otherwise, reconstruct a fully-qualified origin from X-Forwarded-Proto/-Host if a
    #     reverse proxy set them (NPM's proxy host for this add-on is configured to -- see
    #     rustdesk-web/DOCS.md), falling back to this connection's own scheme/Host header when
    #     neither is present (true direct access via the optional non-ingress port 21114, where
    #     the browser's own Host header already has the right address, port included). This
    #     branch's replacement already has an explicit scheme, so nginx uses it verbatim instead
    #     of auto-qualifying it -- unlike the ingress branch, there is no downstream proxy left to
    #     fix a wrong value here, so it has to be right at this layer.
    map $http_x_forwarded_proto $rd_pub_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_forwarded_host $rd_pub_host {
        default $http_x_forwarded_host;
        ""      $http_host;
    }
    map $http_x_ingress_path $rd_prefix {
        default $http_x_ingress_path;
        ""      "$rd_pub_scheme://$rd_pub_host";
    }

    server {
        listen 21114;

        location / {
            proxy_pass http://127.0.0.1:8099;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect /_admin/ $rd_prefix/_admin/;
        }
    }
}
