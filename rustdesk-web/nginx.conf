worker_processes 1;
pid /tmp/nginx.pid;
daemon off;

events {
    worker_connections 64;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    server {
        listen 21114;

        location / {
            proxy_pass http://127.0.0.1:8099;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # rustdesk-api's root handler issues an absolute-path redirect with no awareness of
            # a reverse-proxy path prefix (http/controller/web/index.go: c.Redirect(302,
            # "/_admin/")). Every Home Assistant add-on is served under ingress at a per-session
            # prefix (/api/hassio_ingress/<token>/...), so that raw redirect sends the browser
            # to <ha-host>/_admin/ instead of <ha-host>/api/hassio_ingress/<token>/_admin/ -- a
            # 404, since Home Assistant itself has no /_admin/ route (confirmed live: this is
            # exactly what happened opening this add-on's sidebar panel before this fix).
            # Home Assistant's ingress proxy sets X-Ingress-Path to exactly the prefix the
            # browser is actually using; rewrite the Location header with it. Falls back to the
            # plain unprefixed value when accessed directly via the optional non-ingress port
            # 21114, where X-Ingress-Path is absent and the empty substitution is a no-op.
            proxy_redirect /_admin/ $http_x_ingress_path/_admin/;
        }
    }
}
