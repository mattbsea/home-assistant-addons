---
name: "Paseo Hub"
description: "Self-hosted Paseo Hub: trigger agents on your Paseo daemons from GitHub, Slack and Discord"
version: "0.2.0"
slug: "paseo_hub"
init: false
url: "https://paseo.sh/docs/hub"

arch:
  - aarch64
  - amd64

startup: application
boot: auto
watchdog: "http://[HOST]:[PORT:3000]/health"

# Hub's web app uses absolute paths, so it cannot sit under HA's ingress prefix.
# Front port 3000 with an HTTPS reverse proxy (Nginx Proxy Manager).
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Paseo Hub dashboard, API and webhooks. Front it with an HTTPS reverse proxy."

map:
  - data:rw

options:
  app_url: "http://homeassistant.local:3000"
  trusted_client_ip_header: "x-real-ip"
  env_vars: []

schema:
  app_url: "url"
  trusted_client_ip_header: "str?"
  bootstrap_organization: "str?"
  bootstrap_owner_email: "email?"
  bootstrap_owner_password: "match(^.{12,128}$)?"
  database_url: "password?"
  auth_secret: "password?"
  github_app_slug: "str?"
  github_app_id: "str?"
  github_app_client_id: "str?"
  github_app_client_secret: "password?"
  github_app_private_key: "password?"
  github_app_private_key_path: "str?"
  github_webhook_secret: "password?"
  slack_transport: "list(socket|webhook)?"
  slack_app_id: "str?"
  slack_app_token: "password?"
  slack_client_id: "str?"
  slack_client_secret: "password?"
  slack_signing_secret: "password?"
  discord_client_id: "str?"
  discord_client_secret: "password?"
  discord_bot_token: "password?"
  env_vars:
    - name: "match(^[A-Za-z_][A-Za-z0-9_]*$)"
      value: "str?"
