---
name: "Claude Terminal"
description: "Terminal interface for Anthropic's Claude Code CLI and OpenCode with persistent auth and packages"
version: "2.0.19"
slug: "claude_terminal"
init: false

# Supported architectures
arch:
  - aarch64
  - amd64
  - armv7

# External resources
url: "https://github.com/anthropics/claude-code"

# Web interface configuration
ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:code-braces
panel_title: "Claude Terminal"
panel_admin: true

# Port configuration
ports:
  7681/tcp: 7681
ports_description:
  7681/tcp: "Web terminal (not required for ingress)"

# Add-on configuration options
options:
  auto_launch_claude: true
  auto_continue: true
  claude_args: ""
  openrouter_api_key: ""
  persistent_apt_packages: []
  persistent_pip_packages: []
  claude_tabs: []
  opencode_tabs: []
schema:
  auto_launch_claude: bool?
  auto_continue: bool?
  claude_args: str?
  openrouter_api_key: str?
  persistent_apt_packages:
    - str
  persistent_pip_packages:
    - str
  claude_tabs:
    - directory: str
      args: str?
      prompt: str?
  opencode_tabs:
    - directory: str
      args: str?
      prompt: str?

# Volume mappings for file access
map:
  - data:rw     # Add-on data directory (/data) - /home/claude is persisted here
  - media:rw    # Home Assistant media folder (/media) - exposes /media/USBDisk etc.

# API access for Home Assistant integration
hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true

# Service startup configuration
startup: services

# Web UI access URL
webui: http://[HOST]:[PORT:7681]/
