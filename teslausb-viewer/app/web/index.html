<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TeslaUSB Viewer</title>
  <link rel="stylesheet" href="{{INGRESS_BASE}}/static/style.css">
  <script>
    // Injected server-side: the HA ingress path prefix. Every API/asset/video URL is
    // built from this, because bare "/..." paths 404 under ingress.
    window.INGRESS_BASE = "{{INGRESS_BASE}}";
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚡</span>
      <span>TeslaUSB Viewer</span>
      <span class="ver">v{{VERSION}}</span>
    </div>
    <nav class="tabs" id="folder-tabs">
      <button data-folder="" class="active">All</button>
      <button data-folder="SavedClips">Saved</button>
      <button data-folder="SentryClips">Sentry</button>
      <button data-folder="RecentClips">Recent</button>
    </nav>
    <div class="actions">
      <input type="date" id="date-filter" title="Filter by date">
      <button id="select-btn" title="Select events to delete">☑ Select</button>
      <button id="refresh-btn" title="Re-scan the backend">↻ Refresh</button>
    </div>
  </header>

  <div id="select-bar" class="select-bar"></div>

  <main id="view"><!-- browser or player rendered here --></main>

  <div id="status-bar" class="status-bar"></div>

  <script src="{{INGRESS_BASE}}/static/app.js"></script>
  <script src="{{INGRESS_BASE}}/static/browser.js"></script>
  <script src="{{INGRESS_BASE}}/static/player.js"></script>
  <script>window.TUV.init();</script>
</body>
</html>
